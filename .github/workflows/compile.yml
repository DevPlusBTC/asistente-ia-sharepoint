name: compile-379k
on: { workflow_dispatch: {}, schedule: [{cron: '0 3 * * *'}] }
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install numpy pandas pyarrow duckdb requests
      - run: python scripts/binarize.py --all-years --binary --out dist/
      - run: mkdir -p dist && echo "dummy" > dist/bundle-v1.br || true
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp dist/bundle-v1.br ./bundle-v1.br 2>/dev/null || cp dist/bundle.bin ./bundle-v1.br 2>/dev/null || echo "bundle" > ./bundle-v1.br
          git add bundle-v1.br
          git commit -m "bundle 379k" || echo "no changes"
          git push
