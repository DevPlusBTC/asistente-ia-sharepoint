name: compile-379k
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install numpy pandas pyarrow duckdb
      - run: python scripts/binarize.py --all-years --binary --out dist/
      - run: brotli -f dist/bundle.bin -o dist/bundle-v1.br
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign-blob --yes dist/bundle-v1.br --output-signature dist/bundle-v1.br.sig --output-certificate dist/bundle-v1.br.pem
      - uses: peaceiris/actions-gh-pages@v4
        with: { github_token: ${{ secrets.GITHUB_TOKEN }}, publish_dir: ./dist }
