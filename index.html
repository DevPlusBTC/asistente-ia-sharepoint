<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente IA · Información Comercial</title>
  <style>
    :root{
      --bg:#eef1f6; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
      --brand1:#4f46e5; --brand2:#7c3aed; --line:#e5e7eb;
      --radius:16px; --shadow:0 6px 24px rgba(31,41,55,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI",Inter,Arial,sans-serif;background:linear-gradient(180deg,#eef1f6 0%,#e4e9f2 100%);color:var(--ink);min-height:100vh}
    .app{height:100vh;display:flex;flex-direction:column;max-width:1100px;margin:auto;background:var(--card);box-shadow:var(--shadow)}
    @media(min-width:700px){.app{margin:24px auto;height:calc(100vh - 48px);border-radius:20px;overflow:hidden;border:1px solid var(--line)}}
    header{padding:20px 24px;background:linear-gradient(135deg,var(--brand1),var(--brand2));color:#fff}
    header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
    header h1::before{content:"";width:12px;height:12px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.25)}
    header p{margin:6px 0 0;font-size:13px;opacity:.9}
    main{flex:1;overflow:auto;padding:24px;background:var(--bg)}
    .empty{text-align:center;margin:10vh auto;max-width:620px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:40px 28px;box-shadow:var(--shadow)}
    .empty h2{font-size:26px;margin:0 0 8px}
    .empty p{color:var(--muted);margin:0}
    .empty .hints{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
    .empty .hints button{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--ink)}
    .empty .hints button:hover{border-color:var(--brand1);color:var(--brand1)}
    .msg{max-width:820px;margin:0 auto 16px;display:flex;gap:10px}
    .msg.user{justify-content:flex-end}
    .avatar{flex:0 0 32px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;background:#ede9fe}
    .msg.user .avatar{background:#e0e7ff}
    .bubble{padding:12px 16px;border-radius:var(--radius);line-height:1.55;white-space:pre-wrap;max-width:100%;box-shadow:0 1px 4px rgba(31,41,55,.06)}
    .msg.user .bubble{background:var(--brand1);color:#fff;border-bottom-right-radius:6px}
    .msg.assistant .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
    .msg.assistant table{border-collapse:collapse;margin:10px 0;font-size:13px;display:block;overflow-x:auto}
    .msg.assistant th,.msg.assistant td{border:1px solid var(--line);padding:6px 10px;text-align:left}
    .msg.assistant th{background:#f3f4f6}
    .typing{display:inline-flex;gap:4px;padding:4px 0}
    .typing span{width:7px;height:7px;border-radius:50%;background:#a5b4fc;animation:blink 1.2s infinite}
    .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
    @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
    .composer{padding:14px 18px;border-top:1px solid var(--line);background:var(--card)}
    form{display:flex;gap:10px;max-width:900px;margin:auto;align-items:flex-end}
    textarea{flex:1;resize:none;min-height:48px;max-height:140px;border:1px solid #d1d5db;border-radius:14px;padding:13px 15px;font:inherit;outline:none;background:#f9fafb;transition:border-color .15s, box-shadow .15s}
    textarea:focus{border-color:var(--brand1);box-shadow:0 0 0 3px rgba(99,102,241,.15);background:#fff}
    button.send{border:0;border-radius:14px;padding:0 22px;min-height:48px;background:linear-gradient(135deg,var(--brand1),var(--brand2));color:#fff;font-weight:700;cursor:pointer;transition:transform .1s, opacity .15s}
    button.send:hover{transform:translateY(-1px)}
    button.send:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .status{font-size:12px;color:var(--muted);max-width:900px;margin:7px auto 0;min-height:16px}
    @media(max-width:650px){main{padding:14px}.composer{padding:10px}form{gap:7px}button.send{padding:0 14px}.empty{padding:28px 18px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>Asistente IA</h1>
    <p id="mode">Asistente de información comercial</p>
  </header>

  <main id="chat">
    <div class="empty" id="welcome">
      <h2>¿En qué puedo ayudarte?</h2>
      <p>Consulta conteos, muestras, búsquedas, rankings y cobertura de tus datos comerciales.</p>
      <div class="hints">
        <button data-q="¿Cuántos registros hay?">¿Cuántos registros hay?</button>
        <button data-q="Muéstrame 5 registros de Catalogación">Muéstrame 5 de Catalogación</button>
        <button data-q="¿Qué puedes hacer?">¿Qué puedes hacer?</button>
      </div>
    </div>
  </main>

  <div class="composer">
    <form id="form">
      <textarea id="input" placeholder="Escribe tu pregunta..." rows="1"></textarea>
      <button id="send" class="send" type="submit">Enviar</button>
    </form>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
  const API_URL = "https://asistente-ia-api.devplusdesarrollo.workers.dev/";

  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const send = document.getElementById("send");
  const status = document.getElementById("status");
  const welcome = document.getElementById("welcome");

  document.querySelectorAll(".hints button").forEach(b => {
    b.addEventListener("click", () => {
      input.value = b.getAttribute("data-q");
      form.requestSubmit();
    });
  });

  function addMessage(role, text) {
    if (welcome) welcome.remove();

    const wrap = document.createElement("div");
    wrap.className = "msg " + (role === "user" ? "user" : "assistant");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "🧑" : "🤖";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (role === "assistant") {
      bubble.innerHTML = renderMarkdown(text);
    } else {
      bubble.textContent = text;
    }

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function renderMarkdown(text) {
    const lines = String(text).split("\n");
    let html = "", inTable = false, rows = [];
    const flushTable = () => {
      if (!rows.length) return;
      const body = rows.filter(r => !/^\|?[\s:\-|]+\|?$/.test(r));
      if (body.length) {
        const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => `<td>${escapeHtml(c.trim())}</td>`).join("");
        const head = `<tr>${body[0].trim().replace(/^\||\|$/g, "").split("|").map(c => `<th>${escapeHtml(c.trim())}</th>`).join("")}</tr>`;
        const rest = body.slice(1).map(r => `<tr>${cells(r)}</tr>`).join("");
        html += `<table>${head}${rest}</table>`;
      }
      rows = [];
      inTable = false;
    };
    for (const line of lines) {
      if (/^\s*\|.*\|\s*$/.test(line)) {
        inTable = true;
        rows.push(line);
      } else {
        if (inTable) flushTable();
        if (/^\s*#{1,4}\s+/.test(line)) {
          html += `<strong>${escapeHtml(line.replace(/^\s*#{1,4}\s+/, ""))}</strong><br>`;
        } else if (/^\s*[-•]\s+/.test(line)) {
          html += `• ${escapeHtml(line.replace(/^\s*[-•]\s+/, ""))}<br>`;
        } else if (line.trim() === "") {
          html += "<br>";
        } else {
          let e = escapeHtml(line);
          e = e.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
          html += e + "<br>";
        }
      }
    }
    if (inTable) flushTable();
    return html;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const question = input.value.trim();

    if (!question || send.disabled) return;

    addMessage("user", question);

    input.value = "";
    send.disabled = true;

    const thinking = addMessage("assistant", "");
    thinking.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    status.textContent = "Consultando datos...";

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        credentials: "include",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: question
        })
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();

      if (data.error) {
        throw new Error(data.error);
      }

      thinking.innerHTML = renderMarkdown(
        data.answer ?? "No se recibió una respuesta válida."
      );

      status.textContent = "";

    } catch (err) {
      console.error(err);

      thinking.textContent = "No fue posible obtener la respuesta del asistente.";

      status.textContent = "Error de conexión con el backend.";

    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });
</script>

</body>
</html>
